<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap @5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>Registrar Nuevo Cliente</h2>
    <form method="POST" action="{{ url_for('cliente.registrar_cliente') }}">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del Cliente:</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
        </div>

        <div class="mb-3">
            <label for="documento_num" class="form-label">Documento (NIT/CC):</label>
            <input type="text" class="form-control" id="documento_num" name="documento_num" required>
        </div>

        <div class="mb-3">
            <label for="nombre_empresa" class="form-label">Nombre de Empresa (opcional):</label>
            <input type="text" class="form-control" id="nombre_empresa" name="nombre_empresa">
        </div>

        <div class="mb-3">
            <label for="direccion_empresa" class="form-label">Dirección de Empresa:</label>
            <input type="text" class="form-control" id="direccion_empresa" name="direccion_empresa" required>
        </div>

        <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono:</label>
            <input type="text" class="form-control" id="telefono" name="telefono" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico:</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <button type="submit" class="btn btn-primary">Guardar Cliente</button>
        <a href="{{ url_for('cliente.lista_clientes') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
