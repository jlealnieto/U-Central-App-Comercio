<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap @5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="container mt-4">
    <h2>Editar Cliente</h2>
    <form method="POST" action="">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del Cliente:</label>
            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ cliente.nombre }}" required>
        </div>

        <div class="mb-3">
            <label for="documento_num" class="form-label">Documento (NIT/CC):</label>
            <input type="text" class="form-control" id="documento_num" name="documento_num" value="{{ cliente.documento_num }}" required>
        </div>

        <div class="mb-3">
            <label for="nombre_empresa" class="form-label">Nombre de Empresa (opcional):</label>
            <input type="text" class="form-control" id="nombre_empresa" name="nombre_empresa" value="{{ cliente.nombre_empresa }}">
        </div>

        <div class="mb-3">
            <label for="direccion_empresa" class="form-label">Dirección de Empresa:</label>
            <input type="text" class="form-control" id="direccion_empresa" name="direccion_empresa" value="{{ cliente.direccion_empresa }}" required>
        </div>

        <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono:</label>
            <input type="text" class="form-control" id="telefono" name="telefono" value="{{ cliente.telefono }}" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico:</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ cliente.email }}" required>
        </div>

        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        <a href="{{ url_for('cliente.lista_clientes') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
