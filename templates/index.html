<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda de Barrio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS (opcional para diseño rápido) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap @5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <style>
        body {
            background-color: #f8f9fa;
        }
        .hero {
            background-color: #28a745;
            color: white;
            padding: 4rem 2rem;
            text-align: center;
        }
        .nav-card {
            transition: transform 0.2s;
        }
        .nav-card:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <!-- Hero Section -->
    <section class="hero">
        <h1 class="display-4">Bienvenido a Tu Tienda de Barrio</h1>
        <p class="lead">Sistema de gestión integral para administradores y vendedores</p>
    </section>

    <!-- Menú de Navegación -->
    <div class="container mt-5">
        <div class="row g-4">

            <!-- Registro de Clientes -->
<div class="col-md-4">
    <div class="card nav-card shadow-sm h-100">
        <div class="card-body text-center">
            <h5 class="card-title">Clientes</h5>
            <p class="card-text">Registrar, editar y ver listado de clientes.</p>
            <a href="{{ url_for('cliente.lista_clientes') }}" class="btn btn-outline-info w-100 mb-2">Ver Listado</a>
            <a href="{{ url_for('cliente.registrar_cliente') }}" class="btn btn-primary w-100">Registrar Nuevo</a>
        </div>
    </div>
</div>

       

    <!-- Footer -->
    <footer class="mt-5 py-3 bg-light text-center">
        <p class="mb-0">&copy; 2025 Tienda de Barrio - Todos los derechos reservados</p>
    </footer>

    <!-- Bootstrap JS (opcional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap @5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
